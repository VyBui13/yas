backend:
  image:
    repository: ghcr.io/vybui13/yas-product
    tag: latest

  nameOverride: product
  fullnameOverride: product
  databaseName: product
  ingress:
    enabled: false
  extraVolumes:
    - name: product-application-config
      configMap:
        name: product-application-configmap
  extraVolumeMounts:
    - name: product-application-config
      mountPath: /opt/yas/product
  extraApplicationConfigPaths:
    - /opt/yas/product/product-application.yaml

  extraInitContainers:
    - name: download-opentelemetry-javaagent
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - curl -L -o /otel/opentelemetry-javaagent.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.6.0/opentelemetry-javaagent.jar
      volumeMounts:
        - name: otel-agent
          mountPath: /otel

  extraEnvs:
    - name: JAVA_TOOL_OPTIONS
      value: "-javaagent:/otel/opentelemetry-javaagent.jar"
    - name: OTEL_SERVICE_NAME
      value: "product-service"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://yas-otel-collector.observability.svc.cluster.local:4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    - name: OTEL_TRACES_EXPORTER
      value: "otlp"
    - name: OTEL_METRICS_EXPORTER
      value: "otlp"
    - name: OTEL_LOGS_EXPORTER
      value: "otlp"
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.namespace=yas-msa"

